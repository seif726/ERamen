<!-- LOGIN / LOGOUT SYSTEM -->
<script>

window.addEventListener("DOMContentLoaded", () => {

    let currentUser =
        localStorage.getItem("ERamenCurrentUser");

    let loginBtn =
        document.getElementById("login-btn");

    let footerLoginBtn =
        document.getElementById("footer-login-btn");

    // USER LOGGED IN
    if(currentUser){

        // NAVBAR BUTTON
        if(loginBtn){

            loginBtn.innerHTML =
                `<i class="fas fa-user"></i> ${currentUser}`;

            loginBtn.addEventListener("click", (e) => {

                e.preventDefault();

                let confirmLogout =
                    confirm("Do you want to logout?");

                if(confirmLogout){

                    localStorage.removeItem(
                        "ERamenCurrentUser"
                    );

                    window.location.reload();

                }

            });

        }

        // FOOTER BUTTON
        if(footerLoginBtn){

            footerLoginBtn.innerHTML =
                `<i class="fas fa-user"></i> ${currentUser}`;

            footerLoginBtn.addEventListener("click", (e) => {

                e.preventDefault();

                let confirmLogout =
                    confirm("Do you want to logout?");

                if(confirmLogout){

                    localStorage.removeItem(
                        "ERamenCurrentUser"
                    );

                    window.location.reload();

                }

            });

        }

    }

});

</script>
